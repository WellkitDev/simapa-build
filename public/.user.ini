; Batas unggahan untuk PHP-FPM/CGI (cara cPanel ea-php82 dijalankan).
;
; Tanpa berkas ini, batas yang berlaku adalah bawaan hosting — lazimnya 2M, yang
; menolak PDF 2 MB dan memunculkan "The ebook failed to upload." tanpa sebab yang
; kelihatan. Aplikasi menjanjikan sampai 20 MB per berkas (ManuscriptFile::BATAS_KB),
; jadi batas server harus setidaknya menyamainya supaya janji itu ditepati.
;
; post_max_size dibuat lebih besar dari upload_max_filesize dengan sengaja:
; formulir Direktori ISBN mengirim TIGA slot berkas dalam satu pengiriman, jadi
; yang menentukan adalah jumlahnya, bukan ukuran satu berkas.
;
; Catatan: .user.ini hanya berlaku bila PHP jalan sebagai FPM/CGI. Kalau hosting
; memakai mod_php, berkas ini diabaikan — setel lewat cPanel > MultiPHP INI Editor.
; Perubahan bisa tertunda sampai 5 menit (user_ini.cache_ttl).

upload_max_filesize = 24M
post_max_size = 80M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 300
